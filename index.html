<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pixo — Next-Gen HTML5 Web Games</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <div class="nav-container">
      <div class="brand" onclick="showCatalog()">
        <svg width="38" height="38" viewBox="0 0 40 40" fill="none">
          <rect width="40" height="40" rx="11" fill="var(--accent)"/>
          <path d="M14 27V13H22C24.7614 13 27 15.2386 27 18C27 20.7614 24.7614 23 22 23H14" stroke="#090B10" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="26" cy="27" r="2.5" fill="#090B10"/>
        </svg>
        <span class="brand-name">Pixo</span>
      </div>

      <div class="search-wrapper">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="Søg blandt 100 spil eller genrer..." oninput="filterGames()" />
      </div>

      <div class="nav-right">
        <button class="btn random-btn" onclick="launchRandomGame()" title="Start et tilfældigt spil">
          🎲 Tilfældigt Spil
        </button>

        <button class="profile-btn" onclick="openProfileModal()">
          <div class="avatar-circle" id="headerAvatar">👾</div>
          <div class="profile-meta">
            <span id="headerUsername">Player1</span>
            <span class="lvl-pill" id="headerLevel">Lvl 1</span>
          </div>
        </button>
      </div>
    </div>
  </header>

  <main>
    <div id="catalog-view">
      <section class="hero-banner" id="heroBanner">
        <div class="hero-content">
          <span class="hero-badge">🔥 Dagens Udvalgte 3D / HTML5 Spil</span>
          <h1 id="heroTitle">Astray 3D Maze</h1>
          <p id="heroDesc">Navigér gennem en oplyst 3D-labyrint i WebGL direkte i browseren uden ventetid.</p>
          <div class="hero-actions">
            <button class="btn btn-primary hero-play-btn" id="heroPlayBtn">▶ Spil Nu</button>
            <button class="btn" onclick="pickNewHero()">↻ Nyt Forslag</button>
          </div>
        </div>
        <div class="hero-art" id="heroArt">🧩</div>
      </section>

      <div class="toolbar-row">
        <div class="categories" id="categoryBar">
          <button class="cat-btn active" onclick="setCategory('All', this)">🔥 Alle Spil</button>
          <button class="cat-btn" onclick="setCategory('3D & Racing', this)">🏎️ 3D & Racing</button>
          <button class="cat-btn" onclick="setCategory('Action', this)">⚔️ Action</button>
          <button class="cat-btn" onclick="setCategory('Puzzle', this)">🧩 Puzzle</button>
          <button class="cat-btn" onclick="setCategory('Multiplayer', this)">🌐 2-Player</button>
          <button class="cat-btn" onclick="setCategory('Arcade', this)">🕹️ Arcade</button>
          <button class="cat-btn" onclick="setCategory('Favorites', this)">❤️ Favoritter</button>
        </div>

        <select id="sortSelect" class="sort-select" onchange="filterGames()">
          <option value="featured">Sorter: Udvalgte</option>
          <option value="az">Sorter: A – Å</option>
          <option value="rating">Sorter: Højeste Rating</option>
        </select>
      </div>

      <div class="section-meta">
        <h2 id="sectionTitle">Alle Spil</h2>
        <span class="game-count" id="gameCount">100 spil klar</span>
      </div>

      <div class="game-grid" id="gameGrid"></div>
    </div>
    <div id="player-view">
      <div class="player-topbar">
        <div class="player-info-left">
          <button class="btn" onclick="showCatalog()">← Tilbage</button>
          <div>
            <h2 id="playerTitle">Spiltitel</h2>
            <span id="playerCategory" class="player-sub">Kategori</span>
          </div>
        </div>
        <div class="player-actions">
          <a id="externalFallbackBtn" href="#" target="_blank" rel="noopener" class="btn">↗ Åbn Direkte</a>
          <button class="btn" id="favToggleBtn" onclick="toggleFavoriteCurrent()">🤍 Favorit</button>
          <button class="btn" onclick="toggleTheater()">🖥️ Biograf</button>
          <button class="btn btn-primary" onclick="goFullscreen()">⛶ Fuldskærm</button>
        </div>
      </div>

      <div class="iframe-shell" id="iframeShell">
        <iframe
          id="gameFrame"
          src=""
          scrolling="no"
          allow="fullscreen; gamepad; autoplay; clipboard-write"
        ></iframe>
      </div>
      <button class="theater-exit" onclick="toggleTheater()">✕ Luk Biograf</button>
    </div>
  </main>

  <div class="modal-backdrop" id="profileModal" onclick="if(event.target===this) closeProfileModal()">
    <div class="modal-box">
      <div class="modal-header">
        <h3>Spillerprofil & Stats</h3>
        <button class="btn close-modal-btn" onclick="closeProfileModal()">✕</button>
      </div>

      <div class="xp-card">
        <div class="xp-top">
          <strong id="modalLevelText">Level 1 • Rookie Gamer</strong>
          <span id="modalXpText">0 / 100 XP</span>
        </div>
        <div class="xp-track">
          <div class="xp-fill" id="modalXpFill" style="width: 0%;"></div>
        </div>
      </div>

      <div class="input-group">
        <label>Brugernavn</label>
        <input type="text" id="usernameInput" maxlength="18" placeholder="Indtast gamer tag..." />
      </div>

      <div class="input-group">
        <label>Vælg Avatar</label>
        <div class="avatar-grid" id="avatarPicker"></div>
      </div>

      <div class="input-group">
        <label>Temafarve</label>
        <div class="color-row" id="colorPicker"></div>
      </div>

      <div class="input-group">
        <label>Achievements</label>
        <div class="badge-row" id="achievementsList"></div>
      </div>

      <div class="input-group">
        <label>Senest Spillede</label>
        <div class="recent-list" id="recentGamesList">
          <span class="empty-msg">Ingen spil spillet endnu.</span>
        </div>
      </div>

      <button class="btn btn-primary save-profile-btn" onclick="saveProfile()">Gem Profil</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
